[project]
name = "yoyo-shorts"
version = "0.1.0"
description = "AI-powered YouTube Shorts generator from topic to MP4"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    "edge-tts>=6.1.0",
    "openai-whisper>=20231117",
    "pillow>=10.0",
    "python-dotenv>=1.0",
]

[project.scripts]
yoyo = "cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
